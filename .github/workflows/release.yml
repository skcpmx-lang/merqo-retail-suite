name: Release (Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - run: npm run smoke
      # Re-target native modules to the Electron ABI *after* node-based
      # verification, then package the installer + portable builds.
      - run: npm run rebuild
      - run: npx electron-builder --win nsis portable
      - name: Release notes
        run: node scripts/release-notes.js "${{ github.ref_name }}" > release-notes.md
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: merqo-windows
          path: |
            release/*.exe
            release-notes.md
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
          body_path: release-notes.md
