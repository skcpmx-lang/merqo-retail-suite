name: asset-recovery

# One-shot FINAL RELEASE ASSET RECOVERY utility.
#
# Attaches the EXISTING verified binaries from Actions run 35072583687
# (artifact `merqo-windows`, built from verified commit 19150e8) to the
# EXISTING draft release v1.0.0-gate.9.
#
# This workflow does NOT:
#   - rebuild anything (it downloads the existing artifact by run id)
#   - modify application code
#   - delete or recreate any tag
#   - publish v1.0.0 (both releases stay Draft)
#
# It exists because the operator sandbox's network egress blocks GitHub's
# blob storage (artifacts/release assets), so byte-level verification and
# `gh release upload` must run on GitHub-hosted runners instead.

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/01a0a95d-merqo-retail-suite'
    paths:
      - '.github/workflows/asset-recovery.yml'

permissions:
  contents: write
  actions: read

jobs:
  attach-verified-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Download EXISTING artifact from run 35072583687 (no rebuild)
        uses: actions/download-artifact@v4
        with:
          run-id: 35072583687
          name: merqo-windows
          path: win
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify artifact contents and stage verified files
        shell: bash
        run: |
          set -euo pipefail
          echo "--- full artifact listing ---"
          find win -type f -exec ls -la {} +
          SETUP=$(find win -type f -name '*-Setup-1.0.0.exe' | head -n1 || true)
          PORTABLE=$(find win -type f -name '*-Portable-1.0.0.exe' | head -n1 || true)
          NOTES=$(find win -type f -name 'release-notes.md' | head -n1 || true)
          if [ -z "$SETUP" ] || [ -z "$PORTABLE" ]; then
            echo "::error::expected exes missing from artifact. listing=$(find win -type f | tr '\n' ' ')"
            exit 1
          fi
          mkdir -p stage
          cp "$SETUP" "stage/$(basename "$SETUP")"
          cp "$PORTABLE" "stage/$(basename "$PORTABLE")"
          if [ -n "$NOTES" ]; then cp "$NOTES" stage/release-notes.md; fi
          cd stage
          ls -la
          for f in *Setup*.exe *Portable*.exe; do
            s=$(stat -c %s "$f")
            if [ "$s" -lt 85000000 ]; then echo "::error::$f suspiciously small: $s"; exit 1; fi
          done
          # Regenerate SHA256SUMS.txt from the verified bytes (same format as the
          # release workflow's Checksums step: "<sha256>  <name>" CRLF, ascii).
          : > SHA256SUMS.txt
          for f in *Setup*.exe *Portable*.exe; do
            h=$(sha256sum "$f" | awk '{print $1}')
            printf '%s  %s\r\n' "$h" "$f" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt
          sha256sum -c <(sed 's/\r$//' SHA256SUMS.txt)
          echo "ARTIFACT VERIFIED"

      - name: Attach ONLY verified binaries + checksum to existing draft (clobber)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        working-directory: stage
        run: |
          set -euo pipefail
          SETUP=$(ls *Setup*.exe | head -n1)
          PORTABLE=$(ls *Portable*.exe | head -n1)
          gh release upload v1.0.0-gate.9 "$SETUP" "$PORTABLE" SHA256SUMS.txt --clobber
          echo "--- release assets after upload ---"
          gh release view v1.0.0-gate.9 --json assets --jq '.assets[] | "\(.name) \(.size) bytes"'

      - name: Record verification in draft release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        working-directory: stage
        run: |
          set -euo pipefail
          SETUP=$(ls *Setup*.exe | head -n1)
          PORTABLE=$(ls *Portable*.exe | head -n1)
          gh release view v1.0.0-gate.9 --json body --jq '.body' > notes.md
          {
            echo
            echo "---"
            echo "**Asset recovery verified — $(date -u +%Y-%m-%dT%H:%M:%SZ)**"
            echo
            echo "Source: Actions run \`35072583687\` (commit \`19150e8\`), artifact \`merqo-windows\` — existing verified binaries, no rebuild."
            echo
            echo '```'
            sha256sum "$SETUP" "$PORTABLE"
            stat -c '%n %s bytes' "$SETUP" "$PORTABLE"
            echo '```'
            echo
            echo "This release remains a **Draft** awaiting human validation. \`v1.0.0\` is NOT published."
          } >> notes.md
          gh release edit v1.0.0-gate.9 --notes-file notes.md
          echo "Notes updated."
